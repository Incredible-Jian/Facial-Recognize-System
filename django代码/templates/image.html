{% extends 'base.html' %}
{% load static %}

{% block content %}
    <div class="card">
        <h2><i class="fas fa-image"></i> 图片表情识别</h2>

        <div class="upload-area" id="uploadArea">
            <label for="imageInput" class="custom-upload-btn">
                <i class="fas fa-cloud-upload-alt"></i>
                <div class="upload-text">点击选择图片</div>
                <div class="upload-hint">支持 JPG/PNG 格式，最大 5MB</div>
                <input type="file" id="imageInput" accept="image/*" class="file-input">
            </label>
        </div>

        <div id="processing" class="processing-container" style="display:none;">
            <div class="spinner"></div>
            <p class="progress-text">图片处理中...</p>
        </div>

        <div id="results" class="results-container">
            <div class="result-content">
                <div class="image-comparison">
                    <div class="image-box">
                        <h3>原始图片</h3>
                        <img id="originalImg" class="result-img" style="max-height: 400px; object-fit: contain;">
                    </div>
                    <div class="image-box">
                        <h3>识别结果</h3>
                        <img id="resultImg" class="result-img" style="max-height: 400px; object-fit: contain;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // 验证文件类型和大小
            if (!file.type.match('image.*')) {
                alert('请选择图片文件');
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                alert('文件大小不能超过5MB');
                return;
            }

            // 显示处理状态
            document.getElementById('processing').style.display = 'block';
            document.getElementById('results').style.display = 'none';

            const formData = new FormData();
            formData.append('image', file);

            fetch("{% url 'process_image' %}", {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}'
                }
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        // 显示结果并自动缩放
                        const originalImg = document.getElementById('originalImg');
                        const resultImg = document.getElementById('resultImg');

                        originalImg.src = data.original + '?t=' + Date.now();
                        resultImg.src = data.result + '?t=' + Date.now();

                        originalImg.onload = function() {
                            adjustImageSize(originalImg);
                        };
                        resultImg.onload = function() {
                            adjustImageSize(resultImg);
                        };

                        document.getElementById('results').style.display = 'block';
                    } else {
                        alert('处理失败: ' + (data.message || '未知错误'));
                    }
                })
                .catch(error => {
                    alert('请求出错: ' + error.message);
                })
                .finally(() => {
                    document.getElementById('processing').style.display = 'none';
                });
        });

        function adjustImageSize(imgElement) {
            const container = imgElement.parentElement;
            const ratio = imgElement.naturalWidth / imgElement.naturalHeight;
            const maxHeight = 400;

            if (imgElement.naturalHeight > maxHeight) {
                imgElement.style.height = maxHeight + 'px';
                imgElement.style.width = (maxHeight * ratio) + 'px';
            } else {
                imgElement.style.height = 'auto';
                imgElement.style.width = 'auto';
            }
        }
    </script>
{% endblock %}
